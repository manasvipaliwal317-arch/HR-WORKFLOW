<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Tech Innovations Inc.</title>
  <meta name="description" content="The requested security asset or page could not be located.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              dark: '#070a13',
              card: '#0f172a',
              cyan: '#06b6d4',
              cyanLight: '#22d3ee',
              blue: '#3b82f6',
              emerald: '#10b981'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#070a13] text-slate-200 cyber-grid-bg antialiased selection:bg-cyan-500 selection:text-white flex flex-col min-h-screen justify-between">

  <!-- HEADER -->
  <header class="p-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold">🛡️</div>
        <span class="text-base font-bold text-white">Tech Innovations <span class="text-cyan-400">Inc.</span></span>
      </a>
      <a href="index.html" class="btn-cyber-secondary text-xs !py-2 !px-4">Return Home</a>
    </div>
  </header>

  <!-- 404 CONTENT -->
  <main class="flex-1 flex items-center justify-center p-6 text-center">
    <div class="glass-panel max-w-lg p-10 rounded-2xl border-cyan-500/30 space-y-5">
      <span class="text-6xl font-extrabold text-gradient-cyan block font-mono">404</span>
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-950/80 border border-rose-500/30 text-rose-300 text-xs font-mono">
        ⚠️ RESOURCE_NOT_LOCATED
      </div>
      <h2 class="text-2xl font-bold text-white">Asset Or Endpoint Not Found</h2>
      <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
        The requested URL or cybersecurity asset does not exist or has been relocated to a secure sector.
      </p>
      <div class="pt-3 flex items-center justify-center gap-4">
        <a href="index.html" class="btn-cyber-primary text-xs !py-2.5 !px-5">➔ Back to Homepage</a>
        <a href="services.html" class="btn-cyber-secondary text-xs !py-2.5 !px-5">Explore Services</a>
      </div>
    </div>
  </main>

  <footer class="p-6 text-center text-xs text-slate-500 border-t border-slate-900">
    <p>© 2026 Tech Innovations Inc. Khandwa, Madhya Pradesh, India.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
