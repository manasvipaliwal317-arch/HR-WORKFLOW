services:
  - type: web
    name: nexus-hr-recruitment
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: HR_EMAIL
        value: manasvipaliwal317@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: COMPANY_NAME
        value: Tech Innovations Inc.
      - key: SELECTION_SCORE_THRESHOLD
        value: 70
      - key: AUTO_SEND_EMAILS
        value: true
      - key: EMAIL_RELAY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
